version: '3.8'

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=worksphere.settings
      - DEBUG=True
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: .
    command: celery -A worksphere worker -l info
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=worksphere.settings
    depends_on:
      - redis
