{% extends 'base/base.html' %}
{% block title %}Page Not Found (404){% endblock %}
{% block content %}
<div style="min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center;">
  <div class="card" style="max-width: 500px; padding: 2.5rem 2rem;">
    <div style="font-size: 3.5rem; color: #3b82f6; margin-bottom: 1rem;"><i class="fa-solid fa-compass"></i></div>
    <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">Page Not Found</h2>
    <p style="color: #64748b; margin-bottom: 1.5rem;">The requested enterprise resource or module URL does not exist.</p>
    <a href="{% url 'core:dashboard' %}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Dashboard</a>
  </div>
</div>
{% endblock %}
