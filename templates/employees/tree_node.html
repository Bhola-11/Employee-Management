<li style="margin-bottom: 0.85rem;">
  <div style="display: inline-flex; align-items: center; gap: 0.65rem; background: var(--bg-card); border: 1px solid var(--border-color); padding: 0.6rem 1rem; border-radius: 8px; box-shadow: var(--shadow-sm);">
    <i class="fa-solid fa-user-tie" style="color: var(--primary);"></i>
    <a href="{% url 'employees:detail' item.id %}" style="font-weight: 700; color: var(--text-main);">{{ item.name }}</a>
    <span style="font-size: 0.8rem; color: var(--text-muted);">({{ item.designation|default:'Executive' }} &bull; {{ item.department }})</span>
  </div>
  {% if item.subordinates %}
  <ul style="list-style: none; padding-left: 2rem; margin-top: 0.65rem; border-left: 2px dashed #cbd5e1;">
    {% for child in item.subordinates %}
      {% include 'employees/tree_node.html' with item=child %}
    {% endfor %}
  </ul>
  {% endif %}
</li>
