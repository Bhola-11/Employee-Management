<li style="margin-bottom: 0.75rem;">
  <div style="display: inline-flex; align-items: center; gap: 0.5rem; background: #f8fafc; border: 1px solid #e2e8f0; padding: 0.5rem 0.85rem; border-radius: 6px;">
    <i class="fa-solid fa-user-tie text-primary"></i>
    <a href="{% url 'employees:detail' item.employee.id %}" style="font-weight: 600;">{{ item.employee.full_name }}</a>
    <span style="font-size: 0.8rem; color: #64748b;">({{ item.employee.designation.title|default:'Executive' }})</span>
  </div>
  {% if item.reports %}
  <ul style="list-style: none; padding-left: 1.75rem; margin-top: 0.5rem; border-left: 2px dashed #cbd5e1;">
    {% for child in item.reports %}
      {% include 'employees/tree_node.html' with item=child %}
    {% endfor %}
  </ul>
  {% endif %}
</li>
